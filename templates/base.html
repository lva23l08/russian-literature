<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Русская литература</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1><a href="/">Русская литература</a></h1>
        <nav>
            <a href="/">Главная</a>
            
            <!-- Вот тут логика входа и выхода -->
            {% if session.get('user_id') %}
                <span style="margin-left: 20px; font-weight: bold;">Привет, {{ session['username'] }}!</span>
                <a href="/logout" style="margin-left: 10px; color: red;">Выйти</a>
            {% else %}
                <a href="/login">Вход</a>
            {% endif %}
            
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 Сайт «Русская литература»</p>
    </footer>
</body>
</html>
